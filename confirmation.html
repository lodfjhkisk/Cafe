<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>پیام تایید</title>
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
      type="text/css"
    />
    <style>
      body {
        font-family: "Vazir", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        line-height: 1.8;
        padding: 0;
      }

      .message-container {
        background-color: white;
        padding: 1.5rem;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        width: 95%;
        max-width: 100%;
        margin: 1rem;
        border: 1px solid rgba(0, 0, 0, 0.05);
      }

      #message {
        font-size: 1rem;
        color: #444;
        margin: 0;
        white-space: pre-line;
        text-align: justify;
        word-break: break-word;
      }

      .highlight {
        color: #2e7d32;
        font-weight: bold;
        background-color: #e8f5e9;
        padding: 0.1rem 0.3rem;
        border-radius: 4px;
      }

      .link {
        color: #1565c0;
        text-decoration: none;
        font-weight: bold;
        transition: all 0.3s ease;
        display: inline-block;
        margin-top: 1rem;
        border: 1px solid #1565c0;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        width: 100%;
        text-align: center;
        box-sizing: border-box;
      }

      .link:hover {
        background-color: #1565c0;
        color: white;
        text-decoration: none;
      }

      @media (min-width: 768px) {
        .message-container {
          padding: 2.5rem;
          width: 90%;
          max-width: 600px;
        }
        
        #message {
          font-size: 1.1rem;
        }
        
        .link {
          width: auto;
          display: inline;
        }
      }
    </style>
  </head>
  <body>
    <div class="message-container">
      <p id="message"></p>
    </div>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const name = urlParams.get("name");
      const age = urlParams.get("age");

      const message = `سلام چطوری

میدونم اسمت <span class="highlight">${name}ه</span> و حتی میدونم <span class="highlight">${age}</span> سالته
ولی <span class="highlight">${name}</span> جان باور کن این ذره ای برام اهمیت نداره
تنهاچیزی که برام مهمه اینه که بیای کافه ما یه چیزی سفارش بدی ما فروشمون بیشتر شه آخر ماه چک داریم

عشق منیا ولی اگه نیای 
خیلی خری
ابلفضلی نامردی 
دلخور نشیا ولی ایشالله بری زیر تریلی اگه نیای

قربونت برم بازم خودت میدونی من هیچ اجباری ندارم لینک پیجمونو برات گذاشتم خواستی بیا نخواستیم خاک تو سرت لیاقت نداری

<a href="https://instagram.com/coverbesaz?utm_medium=copy_link" class="link" target="_blank">لینک کافه ما</a>`;

      document.getElementById("message").innerHTML = message;
    </script>
  </body>
</html>
